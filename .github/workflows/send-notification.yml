# Reusable workflow: sends one HTML e-mail for a GitHub event through Brevo SMTP.
# Callers invoke it with `uses: Gybra/github-email-notifications/.github/workflows/send-notification.yml@v1`
# (see notify.yml). The sender script is embedded below on purpose: it is versioned together
# with this file and needs no checkout, no token for this repository and no extra dependency.
name: Send email notification

on:
  workflow_call:
    inputs:
      enabled:
        description: "'true' to send. Anything else (or empty) sends nothing."
        type: string
        required: false
        default: "false"
      recipients:
        description: "Comma-separated recipient addresses (NOTIFICATION_EMAILS)."
        type: string
        required: false
        default: ""
      from:
        description: "Brevo-verified sender: 'a@b.com' or 'Name <a@b.com>' (NOTIFICATION_FROM)."
        type: string
        required: false
        default: ""
      branches:
        description: "Comma-separated branch names or glob patterns. Empty = main,master."
        type: string
        required: false
        default: ""
      events:
        description: "Comma-separated: push, pr_opened, pr_merged, pr_closed. Empty = push,pr_opened,pr_merged."
        type: string
        required: false
        default: ""
      timezone:
        description: "IANA timezone used for dates in the e-mail."
        type: string
        required: false
        default: "Europe/Rome"
    secrets:
      smtp_login:
        description: "Brevo SMTP login (BREVO_SMTP_LOGIN)."
        required: true
      smtp_key:
        description: "Brevo SMTP key (BREVO_SMTP_KEY)."
        required: true

jobs:
  send:
    name: Send email
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # read commits for the push / PR-merge de-duplication
      pull-requests: read   # list PR commits and PRs associated with a commit
    # One group per distinct event: re-deliveries of the same event are serialized,
    # different pushes / PR updates never cancel or replace each other.
    concurrency:
      group: email-notification-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.updated_at || github.sha }}
      cancel-in-progress: false
    steps:
      - name: Send notification
        shell: python3 -I {0}
        env:
          NOTIFY_ENABLED: ${{ inputs.enabled }}
          NOTIFY_RECIPIENTS: ${{ inputs.recipients }}
          NOTIFY_FROM: ${{ inputs.from }}
          NOTIFY_BRANCHES: ${{ inputs.branches }}
          NOTIFY_EVENTS: ${{ inputs.events }}
          NOTIFY_TIMEZONE: ${{ inputs.timezone }}
          SMTP_HOST: smtp-relay.brevo.com
          SMTP_PORT: "587"
          SMTP_LOGIN: ${{ secrets.smtp_login }}
          SMTP_KEY: ${{ secrets.smtp_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          """Send one GitHub event notification e-mail through Brevo SMTP (STARTTLS).

          All event data comes from the payload file and environment variables; nothing
          from the event is ever interpolated into this source (no workflow injection).
          Everything rendered into HTML is escaped; recipient addresses are never logged.
          """
          from __future__ import annotations

          import html
          import json
          import os
          import re
          import smtplib
          import ssl
          import sys
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from email.message import EmailMessage
          from email.utils import formataddr, formatdate, make_msgid, parseaddr
          from fnmatch import fnmatchcase
          from zoneinfo import ZoneInfo, ZoneInfoNotFoundError

          DEFAULT_BRANCHES = "main,master"
          DEFAULT_EVENTS = "push,pr_opened,pr_merged"
          DEFAULT_SENDER_NAME = "GitHub Notifications"
          KNOWN_EVENTS = ("push", "pr_opened", "pr_merged", "pr_closed")
          MAX_RECIPIENTS = 50  # guard for the Brevo free plan: every recipient counts as one e-mail
          MAX_LISTED_COMMITS = 10
          MAX_MESSAGE_CHARS = 1000
          SMTP_TIMEOUT = 30
          RETRY_DELAYS = (10, 30)  # seconds before the 2nd and the 3rd SMTP attempt

          EMAIL_RE = re.compile(
              r"[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+"
              r"@(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}"
          )
          SHA_RE = re.compile(r"[0-9a-f]{40}")
          CONTROL_RE = re.compile(r"[\x00-\x1f\x7f]+")

          COLORS = {
              "push": "#0969da",
              "pr_opened": "#1a7f37",
              "pr_merged": "#8250df",
              "pr_closed": "#cf222e",
              "test": "#57606a",
          }
          FONT = "-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
          MONO = "SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace"


          class ConfigError(Exception):
              """Missing or invalid configuration: fail immediately."""


          class SendError(Exception):
              """Permanent SMTP failure: retrying would not help."""


          class TransientError(Exception):
              """Temporary SMTP or network failure: worth a retry."""


          def main() -> int:
              try:
                  return run(os.environ)
              except ConfigError as exc:
                  log("error", f"Configuration error: {exc}")
              except SendError as exc:
                  log("error", f"E-mail not sent: {exc}")
              return 1


          def run(env) -> int:
              if not parse_bool(env.get("NOTIFY_ENABLED")):
                  log("notice", "Notifications are disabled (NOTIFICATION_ENABLED is not 'true'). Nothing sent.")
                  return 0

              events = parse_events(env.get("NOTIFY_EVENTS"))
              branches = parse_list(env.get("NOTIFY_BRANCHES")) or parse_list(DEFAULT_BRANCHES)
              recipients = parse_recipients(env.get("NOTIFY_RECIPIENTS"))
              sender_name, sender = parse_sender(env.get("NOTIFY_FROM"))
              login, key = env.get("SMTP_LOGIN") or "", env.get("SMTP_KEY") or ""
              if not login or not key:
                  raise ConfigError(
                      "SMTP credentials are empty: set the BREVO_SMTP_LOGIN and BREVO_SMTP_KEY secrets "
                      "and pass them to the reusable workflow (runs started by Dependabot need them as Dependabot secrets)."
                  )

              payload = load_payload(env.get("GITHUB_EVENT_PATH"))
              event_name = env.get("GITHUB_EVENT_NAME") or ""
              repository = payload.get("repository") or {}
              repo = env.get("GITHUB_REPOSITORY") or repository.get("full_name") or ""
              ctx = {
                  "repo": repo,
                  "repo_name": repository.get("name") or repo.split("/")[-1],
                  "server": (env.get("GITHUB_SERVER_URL") or "https://github.com").rstrip("/"),
                  "api": (env.get("GITHUB_API_URL") or "https://api.github.com").rstrip("/"),
                  "token": env.get("GH_TOKEN") or "",
                  "run_id": env.get("GITHUB_RUN_ID") or "",
                  "tz": load_timezone(env.get("NOTIFY_TIMEZONE")),
                  "events": events,
                  "branches": branches,
                  "recipient_count": len(recipients),
              }

              kind, branch = classify(event_name, payload, env.get("GITHUB_REF_NAME") or "")
              if kind is None:
                  log("notice", f"Event '{event_name}' with action '{payload.get('action') or '-'}' is not notified.")
                  return 0
              if kind != "test":
                  if kind not in events:
                      log("notice", f"'{kind}' is not enabled in NOTIFICATION_EVENTS. Nothing sent.")
                      return 0
                  if not any(fnmatchcase(branch, pattern) for pattern in branches):
                      log("notice", f"Branch '{branch}' does not match NOTIFICATION_BRANCHES. Nothing sent.")
                      return 0
                  if kind == "push" and "pr_merged" in events:
                      number = merged_pr_for_push(ctx, payload.get("after"), branch)
                      if number:
                          log("notice", f"This push is the merge of pull request #{number}; the pr_merged e-mail covers it.")
                          return 0

              notification = describe(kind, branch, payload, ctx)
              subject = clean(f"[GitHub] {ctx['repo_name']} \u2014 {notification['headline']}", 250)
              message = build_message(
                  sender_name,
                  sender,
                  recipients,
                  subject,
                  render_text(notification, ctx),
                  render_html(notification, ctx, subject),
              )
              send_email(message, sender, recipients, env.get("SMTP_HOST") or "", int(env.get("SMTP_PORT") or 587), login, key)

              log("notice", f"Sent '{subject}' to {len(recipients)} recipient(s).")
              summary = env.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write(f"E-mail sent: `{subject}` to {len(recipients)} recipient(s).\n")
              return 0


          def log(level: str, message: str) -> None:
              """Emit a workflow command; the escaping stops event data from injecting other commands."""
              data = str(message).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{level}::{data}", flush=True)


          def clean(value, limit: int = 200) -> str:
              """Single-line, length-limited text (safe for headers and log lines)."""
              text = CONTROL_RE.sub(" ", str(value or "")).strip()
              return text if len(text) <= limit else text[: limit - 1] + "\u2026"


          def parse_bool(value) -> bool:
              return (value or "").strip().lower() in ("true", "1", "yes", "on")


          def parse_list(value) -> list[str]:
              return [item.strip() for item in re.split(r"[,;\n]", value or "") if item.strip()]


          def parse_events(value) -> set[str]:
              requested = [item.lower() for item in parse_list(value) or parse_list(DEFAULT_EVENTS)]
              unknown = [item for item in requested if item not in KNOWN_EVENTS]
              if unknown:
                  log("warning", f"Ignoring unknown NOTIFICATION_EVENTS value(s): {', '.join(unknown)}. Allowed: {', '.join(KNOWN_EVENTS)}.")
              events = {item for item in requested if item in KNOWN_EVENTS}
              if not events:
                  raise ConfigError(f"NOTIFICATION_EVENTS has no valid event. Allowed: {', '.join(KNOWN_EVENTS)}.")
              return events


          def parse_recipients(value) -> list[str]:
              valid, seen, invalid = [], set(), 0
              for item in re.split(r"[,;\s]+", value or ""):
                  if not item:
                      continue
                  if len(item) > 254 or not EMAIL_RE.fullmatch(item):
                      invalid += 1
                      continue
                  if item.lower() not in seen:
                      seen.add(item.lower())
                      valid.append(item)
              if invalid:
                  log("warning", f"Skipping {invalid} malformed address(es) in NOTIFICATION_EMAILS.")
              if not valid:
                  raise ConfigError("NOTIFICATION_EMAILS is empty or has no valid address (use comma-separated e-mails).")
              if len(valid) > MAX_RECIPIENTS:
                  raise ConfigError(f"NOTIFICATION_EMAILS has {len(valid)} addresses; the limit is {MAX_RECIPIENTS}.")
              return valid


          def parse_sender(value) -> tuple[str, str]:
              name, address = parseaddr((value or "").strip())
              if not address or not EMAIL_RE.fullmatch(address):
                  raise ConfigError("NOTIFICATION_FROM must be a Brevo-verified sender, e.g. 'notify@example.com' or 'Team <notify@example.com>'.")
              return clean(name, 80) or DEFAULT_SENDER_NAME, address


          def load_timezone(name):
              try:
                  return ZoneInfo((name or "").strip() or "UTC")
              except (ZoneInfoNotFoundError, ValueError):
                  log("warning", f"Unknown timezone '{clean(name, 60)}', using UTC.")
                  return timezone.utc


          def load_payload(path) -> dict:
              if not path:
                  raise ConfigError("GITHUB_EVENT_PATH is not set.")
              try:
                  with open(path, encoding="utf-8") as handle:
                      payload = json.load(handle)
              except (OSError, ValueError) as exc:
                  raise ConfigError(f"cannot read the event payload ({type(exc).__name__}).") from None
              return payload if isinstance(payload, dict) else {}


          def classify(event_name: str, payload: dict, ref_name: str):
              """Map the GitHub event to (kind, branch); kind None means 'not notified'."""
              if event_name == "push":
                  ref = payload.get("ref") or ""
                  return ("push", ref[len("refs/heads/"):]) if ref.startswith("refs/heads/") else (None, "")
              if event_name in ("pull_request", "pull_request_target"):
                  pr = payload.get("pull_request") or {}
                  branch = (pr.get("base") or {}).get("ref") or ""
                  if payload.get("action") == "opened":
                      return "pr_opened", branch
                  if payload.get("action") == "closed":
                      return ("pr_merged" if pr.get("merged") else "pr_closed"), branch
                  return None, branch
              if event_name == "workflow_dispatch":
                  return "test", ref_name
              return None, ""


          def github_get(url: str, token: str):
              """GET a GitHub REST API URL; returns the JSON or None (non-fatal) on any failure."""
              if not token:
                  return None
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "github-email-notifications",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  log("warning", f"GitHub API returned HTTP {exc.code} (check the workflow 'permissions'); continuing without it.")
              except (urllib.error.URLError, TimeoutError, ValueError) as exc:
                  log("warning", f"GitHub API request failed ({type(exc).__name__}); continuing without it.")
              return None


          def merged_pr_for_push(ctx: dict, sha, branch: str):
              """Number of the merged PR that produced this push, so the push e-mail is skipped."""
              if not isinstance(sha, str) or not SHA_RE.fullmatch(sha):
                  return None
              pulls = github_get(f"{ctx['api']}/repos/{ctx['repo']}/commits/{sha}/pulls", ctx["token"])
              for pr in pulls if isinstance(pulls, list) else []:
                  if (
                      isinstance(pr, dict)
                      and pr.get("merged_at")
                      and pr.get("merge_commit_sha") == sha
                      and (pr.get("base") or {}).get("ref") == branch
                  ):
                      return pr.get("number")
              return None


          def safe_url(url, ctx: dict) -> str:
              """Only links that point to this GitHub server are rendered."""
              return url if isinstance(url, str) and url.startswith(ctx["server"] + "/") else ""


          def format_time(value, ctx: dict) -> str:
              moment = None
              if isinstance(value, (int, float)) and not isinstance(value, bool):
                  moment = datetime.fromtimestamp(value, timezone.utc)
              elif isinstance(value, str) and value:
                  try:
                      moment = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  except ValueError:
                      moment = None
              if moment is None or moment.tzinfo is None:
                  moment = datetime.now(timezone.utc)
              return moment.astimezone(ctx["tz"]).strftime("%d %b %Y, %H:%M %Z")


          def first_line(message) -> str:
              lines = str(message or "").strip().splitlines()
              return clean(lines[0] if lines else "", 120)


          def multiline(message) -> str:
              text = str(message or "").strip()
              return text if len(text) <= MAX_MESSAGE_CHARS else text[: MAX_MESSAGE_CHARS - 1] + "\u2026"


          def describe(kind: str, branch: str, payload: dict, ctx: dict) -> dict:
              if kind == "push":
                  return describe_push(payload, branch, ctx)
              if kind == "test":
                  return describe_test(payload, branch, ctx)
              return describe_pull_request(kind, payload, branch, ctx)


          def describe_push(payload: dict, branch: str, ctx: dict) -> dict:
              commits = [commit for commit in payload.get("commits") or [] if isinstance(commit, dict)]
              head = payload.get("head_commit") or (commits[-1] if commits else {}) or {}
              actor = (payload.get("pusher") or {}).get("name") or (payload.get("sender") or {}).get("login") or ""

              if payload.get("deleted"):
                  headline, label, link = f"Branch {branch} deleted", "Branch deleted", None
              else:
                  forced = bool(payload.get("forced"))
                  headline = f"Force push on {branch}" if forced else f"New push on {branch}"
                  label = ("Force push" if forced else "Push") + (" (new branch)" if payload.get("created") else "")
                  compare = safe_url(payload.get("compare"), ctx)
                  if len(commits) > 1 and compare and not payload.get("created"):
                      link = ("View changes", compare)
                  else:
                      commit_url = safe_url(head.get("url"), ctx)
                      link = ("View commit", commit_url) if commit_url else None

              listed = commits[-MAX_LISTED_COMMITS:][::-1]
              when = (payload.get("repository") or {}).get("pushed_at") or head.get("timestamp")
              rows = [
                  ("Repository", ctx["repo"]),
                  ("Event", label),
                  ("Branch", branch),
                  ("Author", actor),
                  ("Date", format_time(when, ctx)),
              ]
              if commits:
                  rows.append(("Commits", str(len(commits))))
              return {
                  "kind": "push",
                  "headline": headline,
                  "rows": rows,
                  "block": ("Latest commit", multiline(head.get("message"))) if head.get("message") else None,
                  "link": link,
                  "commits": [
                      {
                          "sha": str(commit.get("id") or "")[:7],
                          "url": safe_url(commit.get("url"), ctx),
                          "message": first_line(commit.get("message")),
                          "author": clean((commit.get("author") or {}).get("username") or (commit.get("author") or {}).get("name"), 60),
                      }
                      for commit in listed
                  ],
                  "more": len(commits) - len(listed),
                  "preheader": first_line(head.get("message")) or headline,
              }


          def describe_pull_request(kind: str, payload: dict, branch: str, ctx: dict) -> dict:
              pr = payload.get("pull_request") or {}
              number = pr.get("number")
              verb = {"pr_opened": "opened", "pr_merged": "merged", "pr_closed": "closed"}[kind]
              label = {
                  "pr_opened": "Pull request opened",
                  "pr_merged": "Pull request merged",
                  "pr_closed": "Pull request closed without merge",
              }[kind]
              if kind == "pr_opened" and pr.get("draft"):
                  label += " (draft)"
              when = pr.get({"pr_opened": "created_at", "pr_merged": "merged_at", "pr_closed": "closed_at"}[kind])
              head_ref = (pr.get("head") or {}).get("label") or (pr.get("head") or {}).get("ref") or "?"
              actor = (payload.get("sender") or {}).get("login") or (pr.get("user") or {}).get("login") or ""
              title = clean(pr.get("title"), 300)

              commits, total = [], pr.get("commits") if isinstance(pr.get("commits"), int) else 0
              if isinstance(number, int):
                  # shortcut: only the first 100 PR commits are fetched, so PRs with more list commits 91-100; paginate if that matters.
                  fetched = github_get(f"{ctx['api']}/repos/{ctx['repo']}/pulls/{number}/commits?per_page=100", ctx["token"])
                  if isinstance(fetched, list):
                      commits = [commit for commit in fetched if isinstance(commit, dict)][-MAX_LISTED_COMMITS:][::-1]
                      total = max(total, len(fetched))

              rows = [
                  ("Repository", ctx["repo"]),
                  ("Event", label),
                  ("Pull request", f"#{number} {title}"),
                  ("Branch", f"{head_ref} \u2192 {branch}"),
                  ("Author", actor),
                  ("Date", format_time(when, ctx)),
              ]
              if total:
                  rows.append(("Commits", str(total)))
              pr_url = safe_url(pr.get("html_url"), ctx)
              return {
                  "kind": kind,
                  "headline": f"Pull Request #{number} {verb}",
                  "rows": rows,
                  "block": None,
                  "link": ("View pull request", pr_url) if pr_url else None,
                  "commits": [
                      {
                          "sha": str(commit.get("sha") or "")[:7],
                          "url": safe_url(commit.get("html_url"), ctx),
                          "message": first_line((commit.get("commit") or {}).get("message")),
                          "author": clean(
                              (commit.get("author") or {}).get("login")
                              or ((commit.get("commit") or {}).get("author") or {}).get("name"),
                              60,
                          ),
                      }
                      for commit in commits
                  ],
                  "more": max(total - len(commits), 0),
                  "preheader": title or label,
              }


          def describe_test(payload: dict, branch: str, ctx: dict) -> dict:
              run_url = f"{ctx['server']}/{ctx['repo']}/actions/runs/{ctx['run_id']}" if ctx["run_id"].isdigit() else ""
              configuration = (
                  f"Events: {', '.join(sorted(ctx['events']))}\n"
                  f"Branches: {', '.join(ctx['branches'])}\n"
                  f"Recipients: {ctx['recipient_count']}"
              )
              return {
                  "kind": "test",
                  "headline": "Test notification",
                  "rows": [
                      ("Repository", ctx["repo"]),
                      ("Event", "Manual test (workflow_dispatch)"),
                      ("Branch", branch),
                      ("Author", (payload.get("sender") or {}).get("login") or ""),
                      ("Date", format_time(None, ctx)),
                  ],
                  "block": ("Active configuration", configuration),
                  "link": ("View workflow run", run_url) if run_url else None,
                  "commits": [],
                  "more": 0,
                  "preheader": "The Brevo SMTP e-mail notifications are working.",
              }


          def footer(ctx: dict) -> str:
              return (
                  f"Automated notification from GitHub Actions for {ctx['repo']}. "
                  "Recipients are managed in the repository variable NOTIFICATION_EMAILS."
              )


          def render_text(notification: dict, ctx: dict) -> str:
              lines = [notification["headline"], ""]
              lines += [f"{label}: {value}" for label, value in notification["rows"]]
              if notification["block"]:
                  lines += ["", f"{notification['block'][0]}:", notification["block"][1]]
              if notification["commits"]:
                  lines += ["", "Commits:"]
                  lines += [f"- {c['sha']} {c['message']} ({c['author']})" for c in notification["commits"]]
                  if notification["more"]:
                      lines.append(f"... and {notification['more']} more")
              if notification["link"]:
                  lines += ["", f"{notification['link'][0]}: {notification['link'][1]}"]
              lines += ["", "--", footer(ctx)]
              return "\n".join(lines) + "\n"


          def render_html(notification: dict, ctx: dict, subject: str) -> str:
              e = lambda value: html.escape(str(value), quote=True)  # noqa: E731
              color = COLORS[notification["kind"]]

              rows = "".join(
                  '<tr><td style="padding:6px 16px 6px 0;color:#59636e;font-size:13px;white-space:nowrap;vertical-align:top;">'
                  f"{e(label)}</td>"
                  f'<td style="padding:6px 0;font-size:14px;color:#1f2328;word-break:break-word;">{e(value)}</td></tr>'
                  for label, value in notification["rows"]
              )

              block = ""
              if notification["block"]:
                  label, text = notification["block"]
                  block = (
                      f'<p style="margin:20px 0 6px;font-size:13px;color:#59636e;">{e(label)}</p>'
                      '<div style="padding:12px 14px;background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;'
                      f'font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;">{e(text)}</div>'
                  )

              button = ""
              if notification["link"]:
                  label, url = notification["link"]
                  button = (
                      '<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 4px;">'
                      f'<tr><td style="border-radius:6px;background:{color};">'
                      f'<a href="{e(url)}" style="display:inline-block;padding:10px 18px;font-size:14px;font-weight:600;'
                      f'color:#ffffff;text-decoration:none;border-radius:6px;">{e(label)}</a></td></tr></table>'
                  )

              commits = ""
              if notification["commits"]:
                  items = ""
                  for commit in notification["commits"]:
                      sha = (
                          f'<a href="{e(commit["url"])}" style="color:#0969da;text-decoration:none;">{e(commit["sha"])}</a>'
                          if commit["url"]
                          else e(commit["sha"])
                      )
                      items += (
                          '<tr><td width="1%" style="padding:7px 12px 7px 0;border-top:1px solid #eaeef2;vertical-align:top;'
                          f'font-family:{MONO};font-size:12px;white-space:nowrap;">{sha}</td>'
                          '<td style="padding:7px 0;border-top:1px solid #eaeef2;font-size:13px;line-height:1.4;word-break:break-word;">'
                          f'{e(commit["message"])}<span style="color:#59636e;"> &mdash; {e(commit["author"])}</span></td></tr>'
                      )
                  if notification["more"]:
                      items += (
                          '<tr><td colspan="2" style="padding:7px 0;border-top:1px solid #eaeef2;font-size:13px;color:#59636e;">'
                          f"&hellip; and {e(notification['more'])} more</td></tr>"
                      )
                  commits = (
                      '<p style="margin:24px 0 4px;font-size:13px;color:#59636e;">Commits</p>'
                      f'<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">{items}</table>'
                  )

              repo_url = safe_url(f"{ctx['server']}/{ctx['repo']}", ctx)
              repo_link = (
                  f'<a href="{e(repo_url)}" style="color:#ffffff;text-decoration:none;">{e(ctx["repo"])}</a>'
                  if repo_url
                  else e(ctx["repo"])
              )
              return (
                  '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
                  '<meta name="viewport" content="width=device-width, initial-scale=1">'
                  '<meta name="color-scheme" content="light only">'
                  f"<title>{e(subject)}</title></head>"
                  '<body style="margin:0;padding:0;background:#f6f8fa;">'
                  '<div style="display:none;max-height:0;overflow:hidden;opacity:0;">'
                  f"{e(notification['preheader'])}</div>"
                  '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f6f8fa;">'
                  '<tr><td align="center" style="padding:24px 12px;">'
                  '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" '
                  f'style="max-width:600px;background:#ffffff;border:1px solid #d0d7de;border-radius:8px;font-family:{FONT};color:#1f2328;">'
                  f'<tr><td style="background:{color};padding:20px 24px;border-radius:8px 8px 0 0;color:#ffffff;">'
                  f'<div style="font-size:12px;letter-spacing:0.06em;text-transform:uppercase;opacity:0.9;">{repo_link}</div>'
                  f'<div style="font-size:20px;font-weight:600;line-height:1.3;margin-top:4px;">{e(notification["headline"])}</div>'
                  "</td></tr>"
                  '<tr><td style="padding:20px 24px 24px;">'
                  f'<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">{rows}</table>'
                  f"{block}{button}{commits}"
                  "</td></tr>"
                  '<tr><td style="padding:14px 24px;border-top:1px solid #d0d7de;font-size:12px;line-height:1.5;color:#59636e;">'
                  f"{e(footer(ctx))}</td></tr>"
                  "</table></td></tr></table></body></html>"
              )


          def build_message(sender_name: str, sender: str, recipients: list[str], subject: str, text: str, html_body: str) -> EmailMessage:
              message = EmailMessage()
              message["Subject"] = subject
              message["From"] = formataddr((sender_name, sender))
              message["To"] = ", ".join(recipients)
              message["Date"] = formatdate(localtime=False)
              message["Message-ID"] = make_msgid(domain=sender.split("@", 1)[1])
              message["Auto-Submitted"] = "auto-generated"  # suppresses out-of-office auto-replies
              message.set_content(text)
              message.add_alternative(html_body, subtype="html")
              return message


          def send_email(message: EmailMessage, sender: str, recipients: list[str], host: str, port: int, login: str, key: str) -> None:
              attempts = len(RETRY_DELAYS) + 1
              for attempt in range(1, attempts + 1):
                  try:
                      deliver(message, sender, recipients, host, port, login, key)
                      return
                  except TransientError as exc:
                      if attempt == attempts:
                          raise SendError(f"temporary SMTP failure persisted after {attempts} attempts: {exc}") from None
                      delay = RETRY_DELAYS[attempt - 1]
                      log("warning", f"SMTP attempt {attempt}/{attempts} failed ({exc}); retrying in {delay}s.")
                      time.sleep(delay)


          def smtp_reason(exc: smtplib.SMTPResponseException) -> str:
              detail = exc.smtp_error.decode("utf-8", "replace") if isinstance(exc.smtp_error, bytes) else str(exc.smtp_error)
              return clean(f"{exc.smtp_code} {detail}", 200)


          def deliver(message: EmailMessage, sender: str, recipients: list[str], host: str, port: int, login: str, key: str) -> None:
              """One SMTP session. Errors are mapped to TransientError (retry) or SendError (stop)."""
              try:
                  server = smtplib.SMTP(host, port, timeout=SMTP_TIMEOUT)
              except smtplib.SMTPResponseException as exc:
                  raise TransientError(f"connection refused by server: {smtp_reason(exc)}") from None
              except OSError as exc:
                  raise TransientError(f"cannot connect to {host}:{port} ({type(exc).__name__})") from None

              try:
                  server.ehlo()
                  server.starttls(context=ssl.create_default_context())
                  server.ehlo()
                  server.login(login, key)
                  refused = server.send_message(message, from_addr=sender, to_addrs=recipients)
              except smtplib.SMTPAuthenticationError as exc:
                  raise SendError(
                      f"authentication failed ({smtp_reason(exc)}). Check BREVO_SMTP_LOGIN (the SMTP login, not the "
                      "account e-mail) and BREVO_SMTP_KEY (an SMTP key, not an API key)."
                  ) from None
              except smtplib.SMTPNotSupportedError:
                  raise SendError("the server does not support STARTTLS/AUTH on this port.") from None
              except smtplib.SMTPSenderRefused as exc:
                  if 400 <= exc.smtp_code < 500:
                      raise TransientError(f"sender temporarily refused: {smtp_reason(exc)}") from None
                  raise SendError(f"sender refused ({smtp_reason(exc)}). Is NOTIFICATION_FROM verified in Brevo?") from None
              except smtplib.SMTPRecipientsRefused:
                  raise SendError(f"all {len(recipients)} recipient(s) were refused by the server.") from None
              except smtplib.SMTPResponseException as exc:
                  if 400 <= exc.smtp_code < 500:
                      raise TransientError(smtp_reason(exc)) from None
                  raise SendError(f"server rejected the message ({smtp_reason(exc)}). Daily quota reached?") from None
              except smtplib.SMTPServerDisconnected:
                  raise TransientError("server closed the connection") from None
              except ssl.SSLCertVerificationError:
                  raise SendError("TLS certificate verification failed.") from None
              except smtplib.SMTPException as exc:
                  raise SendError(f"SMTP error ({type(exc).__name__}).") from None
              except OSError as exc:
                  raise TransientError(f"network error ({type(exc).__name__})") from None
              finally:
                  try:
                      server.quit()
                  except Exception:  # the message is already accepted (or failed); never retry because of QUIT
                      server.close()

              if refused:
                  log("warning", f"{len(refused)} of {len(recipients)} recipient(s) were refused by the server.")


          if __name__ == "__main__":
              sys.exit(main())
